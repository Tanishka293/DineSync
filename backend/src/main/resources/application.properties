# ==============================================================
# DINESYNC - ENTERPRISE BACKEND CONFIGURATION
# ==============================================================

# Server configuration
server.port=8081
spring.application.name=DineSyncBackend

# ===============================
# 1. MySQL CONFIGURATION (For Users, Orders, Finance)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3308/dinesync_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 2. MONGODB CONFIGURATION (For Restaurants, Menus, Geospatial)
# ===============================
spring.data.mongodb.uri=mongodb://admin:password@127.0.0.1:27019/dinesync_db?authSource=admin

# ===============================
# 3. KAFKA CONFIGURATION (Event-Driven Messaging)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dinesync-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ===============================
# 4. LOGGING (SLF4J/Logback production configuration)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.data.mongodb.uri=mongodb://admin:password@127.0.0.1:27019/dinesync_db?authSource=admin

spring.mongodb.uri=mongodb://admin:password@127.0.0.1:27019/dinesync_db?authSource=admin
spring.data.mongodb.host=127.0.0.1
spring.data.mongodb.port=27019
spring.data.mongodb.database=dinesync_db

# ===============================
# 5. EMAIL CONFIGURATION (SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
